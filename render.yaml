services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: tripnest-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: tripnest-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tripnest-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tripnest-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tripnest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tripnest-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://tripnest-frontend.onrender.com,https://*.vercel.app,http://localhost:5173

  # 2. React Vite Frontend Static Site
  - type: web
    name: tripnest-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tripnest-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: tripnest-db
    databaseName: tripnest
    user: tripnest_user
    plan: free
    region: oregon
